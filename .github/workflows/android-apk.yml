# =============================================================================
# OmniRoute Mobile — Android APK
#
# Compiles this Expo app into a release APK entirely in CI:
#
#   1. stamp version + build number into app.json
#   2. npm ci
#   3. expo prebuild --platform android  (generates the native project)
#   4. ./gradlew assembleRelease          (GitHub runner Android SDK)
#   5. (optional) re-sign with a release keystore from secrets
#   6. upload artifact + publish a GitHub Release with the APK
#
# The resulting APK is signed with the debug key by default (fine for
# sideloading). To publish to Play, add the ANDROID_KEYSTORE_* secrets
# (see README → "Signing the APK for Play Store").
# =============================================================================
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version to stamp (e.g. 1.2.0) — empty keeps app.json"
        required: false
        default: ""
      create_release:
        description: "Publish the APK as a GitHub Release"
        type: boolean
        default: true
  push:
    branches:
      - arena/01a0e9f8-omniroute-mobile

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Stamp version
        id: ver
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version || '' }}"
          [ -z "$VERSION" ] && VERSION="$(node -p "require('./app.json').expo.version")"
          BUILDCODE="${GITHUB_RUN_NUMBER}"
          node scripts/stamp-version.mjs "$VERSION" "$BUILDCODE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "buildcode=$BUILDCODE" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Embedded Node runtime for on-device gateway hosting (docs/LOCAL_GATEWAY.md).
      # Android 10+ cannot exec anything from app-writable storage, so the runtime
      # must live in jniLibs/ and be extracted to the executable /data/app path.
      # ABIs must match the -PreactNativeArchitectures used by the Gradle build.
      # Set the NODE_RUNTIME_SHA256 repo variable to enforce an integrity check.
      - name: Fetch embedded Node runtime
        env:
          NODE_RUNTIME_SHA256: ${{ vars.NODE_RUNTIME_SHA256 }}
        run: node scripts/fetch-node-runtime.mjs --abis arm64-v8a,armeabi-v7a

      # The shim links against node::Start, so if the prebuilt runtime does not
      # export it the build dies at link time with an undefined symbol. Say so
      # here instead, in 30 seconds and in plain language. (Also the only place
      # anything ever looks inside the published artifact.)
      - name: Inspect the fetched runtime
        run: |
          set -euo pipefail
          so=modules/node-runtime/android/src/main/jniLibs/arm64-v8a/libnode.so
          ls -la "$(dirname "$so")"
          readelf -h "$so" | grep -E 'Class:|Machine:|Type:' || true
          # $7 is the Ndx column: UND means the symbol is only referenced, not
          # provided — which is exactly the case that would fail the link.
          if readelf -sW --dyn-syms "$so" \
               | awk '$1 ~ /^[0-9]+:$/ && $7 != "UND" {print $8}' \
               | grep -qx '_ZN4node5StartEiPPc'; then
            echo "✓ libnode.so exports node::Start"
          else
            echo "::error title=libnode.so does not export node::Start::The JNI shim calls node::Start, so the link step cannot succeed with this artifact."
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Detect Android SDK
        id: sdk
        run: |
          set -euo pipefail
          for candidate in "${ANDROID_HOME:-}" /usr/lib/android-sdk "$HOME/Android/Sdk"; do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then
              echo "home=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No Android SDK found (tried ANDROID_HOME, /usr/lib/android-sdk, ~/Android/Sdk)"
          exit 1

      - name: Accept Android SDK licenses
        env:
          ANDROID_SDK_HOME: ${{ steps.sdk.outputs.home }}
        run: |
          yes | "$ANDROID_SDK_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      # The Node runtime module builds C++ from source (modules/node-runtime/
      # android/src/main/cpp), so the build needs CMake in the SDK. The runner
      # images usually ship one; if not, Gradle would try to download it mid-
      # build, which is slower and fails in confusing ways when it goes wrong.
      - name: Ensure CMake is available
        env:
          ANDROID_SDK_HOME: ${{ steps.sdk.outputs.home }}
        run: |
          set -euo pipefail
          present=$(ls "$ANDROID_SDK_HOME/cmake" 2>/dev/null || true)
          if [ -n "$present" ]; then
            echo "CMake already installed: $(echo "$present" | tr '\n' ' ')"
          else
            echo "No CMake in the SDK — installing 3.22.1"
            yes | "$ANDROID_SDK_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1"
          fi

      # With --no-daemon, Gradle forks a single-use daemon that honours
      # org.gradle.jvmargs from gradle.properties — the `-Xmx2048m` the Expo
      # template writes. GRADLE_OPTS only sizes the *launcher* JVM and never
      # reaches the build ("To honour the JVM settings for this build a
      # single-use Daemon process will be forked"), so the heap has to be set
      # in gradle.properties, not via GRADLE_OPTS.
      - name: Tune Gradle memory
        run: |
          # prebuild writes gradle.properties WITHOUT a trailing newline, so a
          # plain >> would glue our first line onto
          # 'expo.inlineModules.watchedDirectories=[]' (autolinking JSON-parses
          # that value at configuration time -> opaque node exit 1).
          if [ -n "$(tail -c 1 android/gradle.properties)" ]; then
            echo >> android/gradle.properties
          fi
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF
          # Fail loudly if the append glued onto a previous line
          grep -qxF "expo.inlineModules.watchedDirectories=[]" android/gradle.properties || {
            echo "::error::gradle.properties corrupted (glued line) - contents:"
            cat android/gradle.properties
            exit 1
          }
          grep -qxF "org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" android/gradle.properties || {
            echo "::error::memory settings were not appended correctly - contents:"
            cat android/gradle.properties
            exit 1
          }

      - name: Gradle release build
        id: gradle
        working-directory: android
        env:
          ANDROID_HOME: ${{ steps.sdk.outputs.home }}
          ANDROID_SDK_ROOT: ${{ steps.sdk.outputs.home }}
          NODE_ENV: production
        # Only the two real-device ABIs. The prebuild default is
        # armeabi-v7a,arm64-v8a,x86,x86_64 — x86/x86_64 are emulator-only and
        # roughly double the CMake/C++ compile time for a universal APK.
        #
        # Teed to a file so the failure reporter below can read it back: this
        # build compiles C++ (modules/node-runtime), and when a native compile
        # fails the interesting line is buried thousands of lines up.
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 \
            | tee "$RUNNER_TEMP/gradle.log"

      # Job logs are not retrievable from every environment, but annotations and
      # the step summary are — so put the actual error there.
      - name: Report Gradle failure
        if: failure() && steps.gradle.outcome == 'failure'
        run: |
          log="$RUNNER_TEMP/gradle.log"
          if [ ! -f "$log" ]; then
            echo "::error title=Gradle failed::no gradle output was captured"
            exit 0
          fi
          {
            echo '### Gradle failed'
            echo '```'
            grep -E 'error:|CMake Error|e: |What went wrong|FAILURE:|> Task .* FAILED|Caused by' "$log" | tail -n 60 || true
            echo '```'
            echo '#### last 40 lines'
            echo '```'
            tail -n 40 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          excerpt=$(grep -E 'error:|CMake Error|What went wrong|FAILURE:|> Task .* FAILED' "$log" | tail -n 10 | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3500)
          echo "::error title=Gradle failed::${excerpt}"

      # A build that silently drops libnode.so still "succeeds" — fail here instead
      # of shipping an APK whose local-gateway feature cannot possibly work.
      - name: Verify embedded Node runtime in APK
        run: node scripts/assert-apk-runtime.mjs android/app/build/outputs/apk/release/app-release.apk --abis arm64-v8a,armeabi-v7a

      # `secrets` is NOT an allowed context in an `if:` expression — GitHub
      # rejects the entire workflow file with "Unrecognized named-value:
      # 'secrets'" (run fails in 0s with no jobs). Check presence in a step
      # instead, where `env:` can read the secret.
      - name: Detect release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set - shipping the debug-signed APK (sideloading only)."
          fi

      - name: Sign with release keystore (optional)
        if: ${{ steps.keystore.outputs.present == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SDK_HOME: ${{ steps.sdk.outputs.home }}
        run: node scripts/sign-apk.mjs android/app/build/outputs/apk/release/app-release.apk

      - name: Package APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/OmnirouteMobile-v${{ steps.ver.outputs.version }}-b${{ steps.ver.outputs.buildcode }}.apk"
          du -sh dist/*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: omniroute-mobile-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.create_release) || github.event_name == 'push' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "mobile-v${{ steps.ver.outputs.version }}-b${{ steps.ver.outputs.buildcode }}"
          name: "OmniRoute Mobile v${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.buildcode }})"
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            **OmniRoute Mobile for Android**

            A native shell over the [OmniRoute](https://github.com/diegosouzapw/OmniRoute) AI gateway —
            every dashboard feature (playground, model catalog, providers, compression engines,
            analytics, logs, settings, …) in one app.

            ### Install
            1. Download `OmnirouteMobile-v*.apk` below.
            2. Copy it to your phone and open it (allow “install unknown apps”).
            3. Enter your gateway URL on the first screen (default: `https://omniroute.online`,
               or your self-hosted gateway built by the **Build OmniRoute source** workflow).
            4. Sign in to the dashboard once — the session is shared across all features.

            > Signed with the debug key (sideloading). See the repo README for release-key signing.
