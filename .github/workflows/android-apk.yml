name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx expo prebuild --platform android --no-install

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Locate or install Android SDK
        id: sdk
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            echo "SDK found at: $ANDROID_HOME"
            echo "sdk_path=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
          elif [ -d /usr/lib/android-sdk ]; then
            echo "SDK found at: /usr/lib/android-sdk"
            echo "sdk_path=/usr/lib/android-sdk" >> "$GITHUB_OUTPUT"
          else
            echo "No preinstalled Android SDK - installing cmdline-tools..."
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
            echo "sdk_path=$SDK_ROOT" >> "$GITHUB_OUTPUT"
          fi

      - name: Accept Android SDK licenses
        env:
          ANDROID_HOME: ${{ steps.sdk.outputs.sdk_path }}
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Tune Gradle memory
        run: |
          # prebuild writes gradle.properties WITHOUT a trailing newline, so a plain >>
          # would glue our first line onto 'expo.inlineModules.watchedDirectories=[]'
          # (autolinking JSON-parses that value at configuration time -> opaque node exit 1).
          if [ -n "$(tail -c 1 android/gradle.properties)" ]; then
            echo >> android/gradle.properties
          fi
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF
          # Fail loudly if the append glued onto a previous line
          grep -qxF "expo.inlineModules.watchedDirectories=[]" android/gradle.properties || {
            echo "::error::gradle.properties corrupted (glued line) - contents:"
            cat android/gradle.properties
            exit 1
          }
          grep -qxF "org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" android/gradle.properties || {
            echo "::error::memory settings were not appended correctly - contents:"
            cat android/gradle.properties
            exit 1
          }

      - name: Gradle release build
        working-directory: android
        env:
          ANDROID_HOME: ${{ steps.sdk.outputs.sdk_path }}
          ANDROID_SDK_ROOT: ${{ steps.sdk.outputs.sdk_path }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Package
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/OmnirouteMobile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: omniroute-mobile-apk
          path: dist/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: dist/*.apk
          fail_on_unmatched_files: false
