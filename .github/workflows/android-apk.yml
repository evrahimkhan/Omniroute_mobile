name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx expo prebuild --platform android --no-install

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          yes | /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Gradle release build
        working-directory: android
        env:
          ANDROID_HOME: /usr/lib/android-sdk
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Package
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/OmnirouteMobile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: omniroute-mobile-apk
          path: dist/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: dist/*.apk
          fail_on_unmatched_files: false
