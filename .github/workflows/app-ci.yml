# =============================================================================
# OmniRoute Mobile — app CI gate
#
# Fast compile check for the mobile app itself, on every push to
# arena/01a0e9f8-omniroute-mobile and every pull request:
#   1. npm ci
#   2. node scripts/check-workflows.mjs  (audit .github/workflows/*.yml)
#   3. tsc --noEmit          (strict typecheck of the whole app)
#   4. expo export           (Metro/Hermes bundle → proves routing + imports)
#
# Step 2 exists because GitHub rejects a workflow file whose expressions use
# a context that isn't available at that key (e.g. `secrets` in an `if:`).
# That failure kills the workflow silently — 0 jobs, no triggers, no retry —
# so it is checked in CI rather than discovered weeks later.
# =============================================================================
name: App CI

on:
  push:
    branches:
      - arena/01a0e9f8-omniroute-mobile
  pull_request:
  workflow_dispatch:

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck & bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint workflow files
        run: node scripts/check-workflows.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Bundle (Metro → Hermes)
        run: npx expo export --platform android --output-dir dist-export
