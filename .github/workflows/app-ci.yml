# =============================================================================
# OmniRoute Mobile — app CI gate
#
# Fast compile check for the mobile app itself, on every push to main and
# every pull request:
#   1. npm ci
#   2. tsc --noEmit          (strict typecheck of the whole app)
#   3. expo export           (Metro/Hermes bundle → proves routing + imports)
# =============================================================================
name: App CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck & bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Bundle (Metro → Hermes)
        run: npx expo export --platform android --output-dir dist-export
