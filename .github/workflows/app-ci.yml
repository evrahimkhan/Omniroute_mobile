# =============================================================================
# OmniRoute Mobile — app CI gate
#
# Fast compile check for the mobile app itself, on every push to
# arena/01a0e9f8-omniroute-mobile and every pull request:
#   1. npm ci
#   2. node scripts/check-workflows.mjs  (audit .github/workflows/*.yml)
#   3. tsc --noEmit          (strict typecheck of the whole app)
#   4. node scripts/embed-gateway-bootstrap.mjs --check  (embedded installer current)
#   5. npm run gateway:test  (installer log lines still match the app's parser)
#   6. npm run payload:test  (the packer's tar.gz survives the on-device extractor)
#   7. npm run payload:install-test  (the installer downloads, verifies, unpacks
#      and boots both payload shapes over loopback — the chain the phone runs)
#   8. expo export           (Metro/Hermes bundle → proves routing + imports)
#
# Step 2 exists because GitHub rejects a workflow file whose expressions use
# a context that isn't available at that key (e.g. `secrets` in an `if:`).
# That failure kills the workflow silently — 0 jobs, no triggers, no retry —
# so it is checked in CI rather than discovered weeks later.
# =============================================================================
name: App CI

on:
  push:
    branches:
      - arena/01a0e9f8-omniroute-mobile
  pull_request:
  workflow_dispatch:

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck & bundle
    # Pinned rather than ubuntu-latest: GitHub starts migrating
    # ubuntu-latest to Ubuntu 26 on 2026-10-19, and the Android job now
    # compiles C++ against a specific NDK/CMake/JDK. A base-image change can
    # move all three, so the upgrade should be a deliberate commit (bump this
    # line, run the workflows, fix what breaks) rather than a surprise.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint workflow files
        run: node scripts/check-workflows.mjs

      # The app ships gateway/bootstrap.mjs as an embedded string, because the
      # script *is* the installer and cannot download itself. Editing the script
      # without regenerating that constant would silently keep shipping the old
      # installer, so fail here instead.
      - name: Check the embedded gateway bootstrap is current
        run: node scripts/embed-gateway-bootstrap.mjs --check

      # The installer reports progress by printing log lines, and the app parses
      # them. When the two drift, nothing fails — the UI just quietly shows the
      # wrong thing — so the contract is asserted against the real lines.
      - name: Check the gateway log contract
        run: npm run gateway:test

      # The packer (CI, writes the payload) and the installer's extractor
      # (on-device, reads it) are two tar implementations that must agree.
      # They did not, once.
      - name: Check the payload round-trips
        run: npm run payload:test

      - name: Check the installer installs and boots both payload shapes
        run: npm run payload:install-test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Bundle (Metro → Hermes)
        run: npx expo export --platform android --output-dir dist-export
