# =============================================================================
# OmniRoute Mobile — iOS via EAS Build
#
# GitHub's free runners cannot produce a signed iOS build without Apple
# credentials, so iOS uses Expo Application Services: EAS compiles the same
# Expo project (this repo) into an IPA on Expo's Apple infrastructure.
#
# One-time setup (see README → "Building the iOS app"):
#   1. `npm i -g eas-cli && eas login`
#   2. `eas init` in this repo (links it to your EAS account)
#   3. `eas build:configure` (or rely on the committed eas.json)
#   4. `eas credentials` (register your Apple certs, or use EAS's automatic ones)
#   5. Add the `EAS_TOKEN` secret to this repo (Settings → Secrets and variables)
#
# The job is skipped automatically when EAS_TOKEN is not configured.
# =============================================================================
name: Build iOS (EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        options:
          - development
          - preview
          - production
        default: production
      submit:
        description: "Submit to App Store after build (production profile only)"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: EAS Build iOS
    # Pinned rather than ubuntu-latest: GitHub starts migrating
    # ubuntu-latest to Ubuntu 26 on 2026-10-19, and the Android job now
    # compiles C++ against a specific NDK/CMake/JDK. A base-image change can
    # move all three, so the upgrade should be a deliberate commit (bump this
    # line, run the workflows, fix what breaks) rather than a surprise.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # `secrets` is NOT an allowed context in a job-level `if:` — GitHub
      # rejects the entire workflow file with "Unrecognized named-value:
      # 'secrets'" before any job is scheduled, so the presence check has to
      # happen inside a step, where `env:` can read the secret.
      - name: Check EAS token
        id: eas
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$EAS_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EAS_TOKEN is not set - skipping the iOS build. See README → Building the iOS app."
          fi

      - name: Checkout
        if: ${{ steps.eas.outputs.enabled == 'true' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: ${{ steps.eas.outputs.enabled == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install EAS CLI
        if: ${{ steps.eas.outputs.enabled == 'true' }}
        run: npm install -g eas-cli

      - name: Build iOS with EAS
        if: ${{ steps.eas.outputs.enabled == 'true' }}
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          set -euo pipefail
          PROFILE="${{ inputs.profile || 'production' }}"
          SUBMIT="${{ inputs.submit || false }}"
          if [ "$SUBMIT" = "true" ] && [ "$PROFILE" = "production" ]; then
            npx eas build --platform ios --profile "$PROFILE" --non-interactive --auto-submit
          else
            npx eas build --platform ios --profile "$PROFILE" --non-interactive
          fi
