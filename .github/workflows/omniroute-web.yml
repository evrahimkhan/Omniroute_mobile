# =============================================================================
# OmniRoute source compiler
#
# Compiles the OmniRoute source (github.com/diegosouzapw/OmniRoute) that this
# mobile app is built over:
#
#   1. `build`  — npm ci + `npm run build:release` (Next.js production build +
#                 CLI bundle) → `omniroute-build.tar.gz` workflow artifact
#                 (contains `.build/` and `dist/`, same layout the upstream
#                 repo's manual build workflow publishes), and → the
#                 **gateway payload** the mobile app downloads and runs
#                 on-device (self-contained standalone output, boot-checked
#                 before it is published; see docs/LOCAL_GATEWAY.md §5b).
#   2. `docker` — builds the upstream Dockerfile into a self-hostable gateway
#                 image: ghcr.io/<owner>/omniroute-mobile:<sha> (and :main on
#                 the main branch), plus Docker Hub when `dockerhub` is
#                 enabled and DOCKERHUB_* secrets are set.
#
# The Android APK workflow (android-apk.yml) builds the native mobile shell;
# this workflow produces the compiled source it connects to.
#
# Triggering: manual, plus a push that changes the payload pipeline itself.
#
# The push trigger exists because `workflow_dispatch` alone cannot be relied
# on for the payload: the "Run workflow" form is generated from the *default
# branch's* copy of this file, and that copy predates the `payload` input — so
# a dispatch can arrive with the input unset, publish nothing, and leave the
# app unable to install with no clue why. Gating the payload steps on the event
# as well as the input removes that dependency. It is deliberately narrowed to
# the payload's own files, so ordinary pushes do not rebuild 116 MB of payload.
#
# NOTE: OmniRoute's own project disabled hosted push triggers for this exact
# build (upstream #11946): the hosted 7 GB runner OOMs `next build` of this
# tree in the majority of attempts even with the 10 GB swap step below. That is
# why the trigger is narrow rather than "on push".
# =============================================================================
name: Build OmniRoute source

on:
  push:
    branches: [arena/01a0e9f8-omniroute-mobile]
    paths:
      - .github/workflows/omniroute-web.yml
      - scripts/pack-payload.mjs
      - scripts/check-payload-pack.mjs
      # The prune step decides which native libraries reach a phone: a change
      # there changes the published payload, so it republishes like the packer.
      - scripts/prune-native-libs.mjs
  workflow_dispatch:
    inputs:
      ref:
        description: "OmniRoute ref to compile (branch, tag, or commit SHA)"
        required: false
        default: "main"
      docker:
        description: "Build & push the Docker gateway image"
        type: boolean
        default: true
      payload:
        description: "Package the on-device gateway payload (the app downloads this)"
        type: boolean
        default: true
      dockerhub:
        description: "Also push to Docker Hub (requires DOCKERHUB_USERNAME + DOCKERHUB_TOKEN secrets)"
        type: boolean
        default: false

concurrency:
  group: omniroute-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OMNIROUTE_REPO: "https://github.com/diegosouzapw/OmniRoute.git"

jobs:
  build:
    name: Compile OmniRoute (Next.js + CLI)
    # Pinned rather than ubuntu-latest: GitHub starts migrating
    # ubuntu-latest to Ubuntu 26 on 2026-10-19, and the Android job now
    # compiles C++ against a specific NDK/CMake/JDK. A base-image change can
    # move all three, so the upgrade should be a deliberate commit (bump this
    # line, run the workflows, fix what breaks) rather than a surprise.
    runs-on: ubuntu-24.04
    permissions:
      # Publish the gateway payload release (the app downloads it from there).
      contents: write
    timeout-minutes: 90
    outputs:
      sha: ${{ steps.fetch.outputs.sha }}
    steps:
      # The OmniRoute tree is large: the upstream project ships this exact
      # step in its own build workflow because `next build` needs >7 GB.
      - name: Expand Virtual Memory (10 GB swap)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout mobile repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Fetch OmniRoute source
        id: fetch
        run: |
          set -euo pipefail
          REF="${{ inputs.ref || 'main' }}"
          # Partial clone: full commit history (so any branch/tag/SHA can be
          # checked out) without downloading every blob of every commit.
          git clone --filter=blob:none --no-checkout "$OMNIROUTE_REPO" source/OmniRoute
          cd source/OmniRoute
          if git rev-parse --verify --quiet "origin/$REF" >/dev/null 2>&1; then
            git checkout -B "$REF" "origin/$REF"
          else
            git checkout "$REF"
          fi
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          git log -1 --oneline

      - name: Install dependencies
        working-directory: source/OmniRoute
        run: npm ci --no-audit --no-fund

      - name: Build Next.js app & CLI bundle
        working-directory: source/OmniRoute
        run: npm run build:release
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
          OMNIROUTE_BUILD_MEMORY_MB: "12288"
          OMNIROUTE_USE_TURBOPACK: "1"

      - name: Archive build outputs
        run: |
          set -euo pipefail
          cd source/OmniRoute
          tar -czf omniroute-build.tar.gz .build dist
          du -sh omniroute-build.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: omniroute-build-${{ steps.fetch.outputs.sha }}
          path: source/OmniRoute/omniroute-build.tar.gz
          retention-days: 14

      # =====================================================================
      # Mobile gateway payload
      #
      # The app downloads this after install and runs it inside its embedded
      # Node runtime (docs/LOCAL_GATEWAY.md §5b). It must be self-contained:
      # the npm tarball is not, because it ships no node_modules and its
      # `dist/server.js` does `require('next')`. Next's `output: 'standalone'`
      # output — which this build already produces, since next.config sets
      # `output: 'standalone'` — is the thing that is.
      #
      # Nothing here is published until it has been extracted and booted, so a
      # payload that cannot serve /healthz fails the run instead of reaching
      # someone's phone. That check is the point: the first dispatch of this job
      # is also the first time these paths are exercised for real.
      # =====================================================================
      - name: Locate the standalone server
        id: standalone
        if: ${{ github.event_name == 'push' || inputs.payload }}
        working-directory: source/OmniRoute
        run: |
          set -uo pipefail
          # Find it rather than assume it: this project sets distDir and
          # outputFileTracingRoot, and `colocate-standalone.mjs` moves the tree after
          # the build, so the same payload can sit at `.build/next/standalone`,
          # `dist/.build/.../standalone` or `.next/standalone`. Vendored trees are
          # pruned rather than merely filtered, because node_modules is 125k files.
          mapfile -t dirs < <(
            find . -maxdepth 8 \
              \( -name node_modules -o -name .git -o -name .next -o -name __pycache__ \) -prune -o \
              -name server.js -printf '%h\n' 2>/dev/null | sort -u
          )
          printf 'server.js candidates:\n'; printf '  %s\n' "${dirs[@]:-<none>}"

          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error title=No standalone server output::next build produced no server.js outside node_modules, so there is nothing to package. Listing the build outputs to fix this in one go."
            find . -maxdepth 3 -type d \( -name .build -o -name dist -o -name .next -o -name standalone \) 2>/dev/null | head -30
            exit 1
          fi

          # Rank the candidates: a Next standalone tree has `.next/BUILD_ID`, and a
          # usable payload carries its own node_modules. Neither test decides on its
          # own, so they only order the choice: the boot check below is the one that
          # decides whether the payload works, and it is the one that can publish.
          chosen=""
          for dir in "${dirs[@]}"; do
            if [ -e "$dir/.next/BUILD_ID" ] && [ -d "$dir/node_modules" ]; then chosen="$dir"; break; fi
          done
          if [ -z "$chosen" ]; then
            for dir in "${dirs[@]}"; do
              if [ -d "$dir/node_modules" ]; then chosen="$dir"; break; fi
            done
          fi
          if [ -z "$chosen" ]; then chosen="${dirs[0]}"; fi
          echo "chosen: $chosen"
          if [ ! -e "$chosen/.next/BUILD_ID" ]; then
            echo "::warning title=Not a Next standalone tree::$chosen has no .next/BUILD_ID; the boot check below will decide whether it is usable."
          fi
          if [ ! -d "$chosen/node_modules" ]; then
            echo "::warning title=Standalone output has no node_modules::The payload will be missing dependencies; the boot check below will decide whether it is usable."
          fi
          # Symlinks inside a standalone tree can point at the build machine
          # (a monorepo/workspace artifact). Count them so a failure here is
          # interpretable rather than mysterious.
          links=$(find "$chosen" -type l 2>/dev/null | wc -l)
          echo "symlinks in the tree: $links"
          echo "dir=$chosen" >> "$GITHUB_OUTPUT"

      # A native library for the wrong CPU cannot load on a phone, ever: the first
      # require() that touches it kills the process with a SIGSEGV and writes
      # nothing at all. This is not hypothetical — measured on a real device, 29 of
      # the published payload's 63 libraries were x86-64, because the whole tree is
      # assembled here, on an x86-64 runner, and `npm ci` resolves npm's "optional"
      # native packages (sharp, wreq-js, node-gyp builds) for the machine that ran
      # it. So the payload ships none of them: what replaces one is the payload's
      # own JavaScript fallback, or a plain "Cannot find module" that prints.
      - name: Drop native libraries built for another CPU
        id: natives
        if: ${{ github.event_name == 'push' || inputs.payload }}
        run: |
          set -uo pipefail
          dir="${{ steps.standalone.outputs.dir }}"
          # Into the step summary as well as the log: the run's log is not
          # readable from every environment, and this is what says which libraries
          # a phone could never have loaded.
          {
            echo '### Native libraries dropped from the payload'
            echo '```'
            node scripts/prune-native-libs.mjs "$dir" --json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # An annotation as well: the run's log is not readable from every
          # environment, and this is the one line that says what the payload
          # contains and why anything was dropped.
          node scripts/prune-native-libs.mjs "$dir" --json > /tmp/native-report.json
          node -e '
            const report = JSON.parse(require("node:fs").readFileSync("/tmp/native-report.json", "utf8"));
            const shown = report.removed.slice(0, 5).map((item) => item.file).join(", ");
            const detail = [
              `${report.libraries} libraries`,
              `dropped ${report.removed.length}`,
              `${report.wrongArch} wrong CPU`,
              `${report.wrongLibc} desktop libc`,
              report.unreadable ? `${report.unreadable} unreadable` : null,
            ].filter(Boolean).join(", ");
            console.log(`::notice title=Native libraries in the payload::${detail}${shown ? `: ${shown}` : ""}`);
          '
          node scripts/prune-native-libs.mjs "$dir"
          # Then prove it, so a payload that still carries one fails here — with a
          # list — instead of on someone's phone.
          node scripts/prune-native-libs.mjs "$dir" --check

      - name: Pack the gateway payload
        id: pack
        if: ${{ github.event_name == 'push' || inputs.payload }}
        working-directory: source/OmniRoute
        run: |
          node ../../scripts/pack-payload.mjs "${{ steps.standalone.outputs.dir }}" \
            -o "$GITHUB_WORKSPACE/omniroute-payload.tar.gz" --entry server.js
          # pack-payload drops a .json manifest next to the archive; publish it
          # so the app can verify what it downloaded.

      # Extract and boot exactly what the app will download, then ask it for
      # /healthz. If this fails, the payload is not published.
      - name: Boot the payload before publishing it
        if: ${{ github.event_name == 'push' || inputs.payload }}
        run: |
          set -uo pipefail
          rm -rf /tmp/payload-check /tmp/payload-home /tmp/payload-tmp
          mkdir -p /tmp/payload-check /tmp/payload-home /tmp/payload-tmp
          tar -xzf omniroute-payload.tar.gz -C /tmp/payload-check

          cd /tmp/payload-check
          PORT=20128 HOSTNAME=127.0.0.1 \
            HOME=/tmp/payload-home TMPDIR=/tmp/payload-tmp \
            node server.js > /tmp/payload-boot.log 2>&1 &
          server_pid=$!

          ok=0
          for i in $(seq 1 60); do
            sleep 2
            if curl -fsS --max-time 5 http://127.0.0.1:20128/healthz >/dev/null 2>&1; then
              ok=1
              echo "✓ the payload booted and answered /healthz after ~$((i * 2))s"
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "server exited early"
              break
            fi
          done

          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true

          if [ "$ok" != "1" ]; then
            {
              echo '### The gateway payload did not boot'
              echo '```'
              tail -n 60 /tmp/payload-boot.log 2>/dev/null || echo '(no output)'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            excerpt=$(tail -n 12 /tmp/payload-boot.log 2>/dev/null | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3000)
            echo "::error title=The gateway payload did not boot::${excerpt}"
            exit 1
          fi

      - name: Publish the gateway payload
        if: ${{ github.event_name == 'push' || inputs.payload }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=gateway-payload
          # A fixed tag, not `latest`: the app also publishes APK releases, and
          # `releases/latest/download/…` would flip to whichever came last,
          # breaking every installed app's payload URL on a routine app release.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Gateway payload (latest)" \
              --notes "Self-contained OmniRoute build that the mobile app downloads and runs on-device. Replaced on every dispatch of the **Build OmniRoute source** workflow."
          fi
          gh release upload "$tag" \
            omniroute-payload.tar.gz \
            omniroute-payload.tar.gz.json \
            --clobber

          # Say what is in the release, on every dispatch: the assets are replaced in
          # place, so a stale description would be worse than none. Everything below is
          # read from the manifest the app verifies against, not recomputed.
          manifest="$GITHUB_WORKSPACE/omniroute-payload.tar.gz.json"
          sha256=$(node -p "require('$manifest').sha256")
          files=$(node -p "require('$manifest').files")
          bytes=$(node -p "require('$manifest').bytes")
          gh release edit "$tag" --notes "$(cat <<EOF
          Self-contained OmniRoute build that the mobile app downloads and runs on-device.

          - built from \`${{ inputs.ref || 'main' }}\` at \`${{ steps.fetch.outputs.sha }}\`
          - packed by workflow run https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - $files files, $bytes bytes uncompressed
          - sha256: \`$sha256\`

          Replaced on every dispatch of the **Build OmniRoute source** workflow. The app
          fetches \`omniroute-payload.tar.gz.json\` and verifies its download against it.
          EOF
          )"
          echo "published to $(gh release view "$tag" --json url --jq .url)"
          cat "$manifest"

      - name: Upload the payload as an artifact too
        if: ${{ github.event_name == 'push' || inputs.payload }}
        uses: actions/upload-artifact@v7
        with:
          name: omniroute-payload-${{ steps.fetch.outputs.sha }}
          path: |
            omniroute-payload.tar.gz
            omniroute-payload.tar.gz.json
          retention-days: 14

  docker:
    name: Build & push gateway Docker image
    # Pinned rather than ubuntu-latest: GitHub starts migrating
    # ubuntu-latest to Ubuntu 26 on 2026-10-19, and the Android job now
    # compiles C++ against a specific NDK/CMake/JDK. A base-image change can
    # move all three, so the upgrade should be a deliberate commit (bump this
    # line, run the workflows, fix what breaks) rather than a surprise.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: ${{ inputs.docker }}
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fetch OmniRoute source
        id: fetch
        run: |
          set -euo pipefail
          REF="${{ inputs.ref || 'main' }}"
          git clone --filter=blob:none --no-checkout "$OMNIROUTE_REPO" source/OmniRoute
          cd source/OmniRoute
          if git rev-parse --verify --quiet "origin/$REF" >/dev/null 2>&1; then
            git checkout -B "$REF" "origin/$REF"
          else
            git checkout "$REF"
          fi
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # build-push-action has no `username`/`password` inputs (removed in
      # v2/v3) and its `github-token` only authenticates *Git context*
      # fetches — pushing to ghcr.io needs an explicit login.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push to GitHub Container Registry
        uses: docker/build-push-action@v7
        with:
          context: source/OmniRoute
          file: source/OmniRoute/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/omniroute-mobile:sha-${{ steps.fetch.outputs.sha }}
            ${{ (inputs.ref || 'main') == 'main' && format('ghcr.io/{0}/omniroute-mobile:main', github.repository_owner) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OMNIROUTE_BUILD_WORKERS=2
            OMNIROUTE_BUILD_MEMORY_MB=6144

      # `secrets` is NOT an allowed context in an `if:` expression — GitHub
      # rejects the entire workflow file with "Unrecognized named-value:
      # 'secrets'" (run fails in 0s with no jobs). Check presence in a step
      # instead, where `env:` can read the secrets.
      - name: Detect Docker Hub credentials
        id: dockerhub
        if: ${{ inputs.dockerhub }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set - skipping the Docker Hub mirror."
          fi

      - name: Log in to Docker Hub (optional)
        if: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push to Docker Hub (optional)
        if: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: source/OmniRoute
          file: source/OmniRoute/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/omniroute-mobile:sha-${{ steps.fetch.outputs.sha }}
            ${{ (inputs.ref || 'main') == 'main' && format('{0}/omniroute-mobile:main', secrets.DOCKERHUB_USERNAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OMNIROUTE_BUILD_WORKERS=2
            OMNIROUTE_BUILD_MEMORY_MB=6144
