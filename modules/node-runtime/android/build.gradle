plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.noderuntime'
version = '0.1.0'

android {
  namespace "expo.modules.noderuntime"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"

    externalNativeBuild {
      cmake {
        // libnode.so is built against the shared libc++ STL, so this side has
        // to match (.so files never carry a static copy of the STL ABI).
        arguments "-DANDROID_STL=c++_shared"
        cppFlags "-fexceptions", "-frtti"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }

  lintOptions {
    abortOnError false
  }
}
